<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Catalog state across a transaction</title>
  <desc id="description">A catalog change creates a staged state and matching system-table page changes. Commit publishes the staged state. Rollback discards it and keeps the original committed state.</desc>
  <defs>
    <style>
      @font-face {
        font-family: Excalifont;
        src: url("data:font/woff2;base64,") format("woff2");
      }

      text {
        font-family: Excalifont, Xiaolai, sans-serif, "Segoe UI Emoji";
        fill: #1e1e1e;
      }

      .title { font-size: 28px; }
      .zone-label { font-size: 20px; }
      .box-label { font-size: 18px; text-anchor: middle; }
      .box-detail { font-size: 16px; text-anchor: middle; }
      .arrow-label { font-size: 15px; text-anchor: middle; }
      .text-blue { fill: #4a9eed; }
      .text-purple { fill: #8b5cf6; }
      .text-green { fill: #22c55e; }
      .zone-blue { fill: #2563eb; }
      .zone-purple { fill: #6d28d9; }
      .zone-green { fill: #15803d; }
      .arrow {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }
    </style>

    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a9eed"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text class="title" x="500" y="48" text-anchor="middle">Catalog State Across a Transaction</text>

  <rect x="30" y="88" width="220" height="462" rx="22" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-opacity="0.35"/>
  <text class="zone-label zone-blue" x="55" y="124">Before</text>

  <rect x="65" y="220" width="150" height="88" rx="16" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text class="box-label text-blue" x="140" y="275">Committed state</text>

  <rect x="290" y="88" width="410" height="462" rx="22" fill="#e5dbff" fill-opacity="0.35" stroke="#8b5cf6" stroke-opacity="0.35"/>
  <text class="zone-label zone-purple" x="315" y="124">Active transaction</text>

  <rect x="390" y="150" width="210" height="66" rx="16" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="box-label text-purple" x="495" y="190">Catalog change</text>

  <rect x="380" y="270" width="230" height="94" rx="16" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="box-label text-purple" x="495" y="310">Staged state</text>
  <text class="box-detail text-purple" x="495" y="340">Visible in the transaction</text>

  <rect x="380" y="424" width="230" height="76" rx="16" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="box-label text-purple" x="495" y="457">System-table</text>
  <text class="box-label text-purple" x="495" y="480">page changes</text>

  <path class="arrow" d="M 215 264 H 336 V 183 H 390" stroke="#4a9eed" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label text-blue" x="275" y="248">copy</text>

  <path class="arrow" d="M 495 216 V 270" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  <text class="arrow-label text-purple" x="570" y="248">apply change</text>

  <path class="arrow" d="M 495 364 V 424" stroke="#8b5cf6" marker-end="url(#arrow-purple)"/>
  <text class="arrow-label text-purple" x="570" y="399">same transaction</text>

  <rect x="740" y="88" width="230" height="462" rx="22" fill="#d3f9d8" fill-opacity="0.3" stroke="#22c55e" stroke-opacity="0.35"/>
  <text class="zone-label zone-green" x="765" y="124">After</text>

  <rect x="780" y="184" width="150" height="100" rx="16" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
  <text class="box-label text-green" x="855" y="220">COMMIT</text>
  <text class="box-detail text-green" x="855" y="246">Staged state</text>
  <text class="box-detail text-green" x="855" y="267">becomes committed</text>

  <rect x="780" y="388" width="150" height="100" rx="16" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
  <text class="box-label text-blue" x="855" y="424">ROLLBACK</text>
  <text class="box-detail text-blue" x="855" y="450">Committed state</text>
  <text class="box-detail text-blue" x="855" y="471">remains</text>

  <path class="arrow" d="M 610 300 H 680 V 234 H 780" stroke="#22c55e" marker-end="url(#arrow-green)"/>
  <text class="arrow-label text-green" x="730" y="217">publish</text>

  <path class="arrow" d="M 610 338 H 680 V 438 H 780" stroke="#4a9eed" marker-end="url(#arrow-blue)"/>
  <text class="arrow-label text-blue" x="730" y="421">discard</text>
</svg>
